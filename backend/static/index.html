<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PelagicFlow — Standalone FastAPI + Leaflet Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "IBM Plex Sans", system-ui, sans-serif; background: #070B12; color: #E2E8F0; height: 100vh; display: flex; flex-direction: column; }
    header { height: 48px; padding: 0 20px; border-bottom: 1px solid #1E293B; display: flex; align-items: center; justify-content: space-between; background: #0B111C; }
    .workspace { flex: 1; display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
    aside { background: #0E1522; border-right: 1px solid #1E293B; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    #map { width: 100%; height: 100%; background: #060910; }
    label { display: block; font-size: 12px; color: #94A3B8; margin-bottom: 4px; }
    select, input, button { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #1E293B; background: #070B12; color: #E2E8F0; font-size: 13px; }
    button.primary { background: #06B6D4; color: #041218; font-weight: 600; border: none; cursor: pointer; }
    .horizon-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .horizon-tabs button.active { background: #06B6D4; color: #041218; border-color: #06B6D4; font-weight: 600; }
    .mono { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <strong>PelagicFlow</strong>
    <span id="api-status" class="mono" style="font-size:12px;color:#94A3B8;">Connecting to Open-Meteo Marine...</span>
  </header>
  <div class="workspace">
    <aside>
      <div>
        <label for="region-select">Accumulation Zone</label>
        <select id="region-select"></select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div><label>Lat Min</label><input id="lat-min" type="number" step="0.5" value="30" /></div>
        <div><label>Lat Max</label><input id="lat-max" type="number" step="0.5" value="40" /></div>
        <div><label>Lon Min</label><input id="lon-min" type="number" step="0.5" value="-155" /></div>
        <div><label>Lon Max</label><input id="lon-max" type="number" step="0.5" value="-135" /></div>
      </div>
      <div>
        <label>Forecast Horizon</label>
        <div class="horizon-tabs">
          <button data-h="0" class="active">0h</button>
          <button data-h="24">24h</button>
          <button data-h="48">48h</button>
          <button data-h="72">72h</button>
        </div>
      </div>
      <button id="run-btn" class="primary">Run GNN Drift Forecast</button>
      <div id="telemetry-summary" class="mono" style="font-size:12px;line-height:1.7;color:#CBD5E1;"></div>
    </aside>
    <div id="map"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
